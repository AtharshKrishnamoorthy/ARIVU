[build-system]
requires = ["setuptools>=61.0,<68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arivu-ai"
version = "0.2.1"
description = "The open-source framework for autonomous database agents."
readme = "README.md"
authors = [
  { name="Arivu AI", email="atharshkrishnamoorthy@gmail.com" }
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy",
    "python-dotenv",
    "langgraph",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-community",
    "faiss-cpu",
    "sentence-transformers",
    "psycopg2-binary",
    "pymysql",
    "fastapi",
    "uvicorn[standard]",
    "python-telegram-bot",
    "flask",
    "twilio",
    "requests",
    "pydub",
    "pytesseract",
    "Pillow",
    "redis",
    "SpeechRecognition",
    "grandalf"
]
requires-python = ">=3.10"

[project.optional-dependencies]
snowflake = ["snowflake-sqlalchemy"]
databricks = ["databricks-sqlalchemy"]
mcp = ["mcp[cli]"]
all = ["snowflake-sqlalchemy", "databricks-sqlalchemy", "mcp[cli]"]

[project.scripts]
arivu-mcp = "arivu.mcp.server:main"

[project.urls]
"Homepage" = "https://github.com/AtharshKrishnamoorthy/ARIVU"
"Documentation" = "https://arivu.mintlify.app/"

[tool.setuptools.packages.find]
where = ["."]
include = ["arivu*"]
exclude = ["arivu.dashboard*", "arivu.docs*", "arivu.examples*"]
